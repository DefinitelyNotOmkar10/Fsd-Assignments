<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Omkar's Portal · Account Registration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="registration-shell">
    <form id="signup" class="auth-card" novalidate>
      <header class="card-header">
        <div class="brand-tag">OMKAR DEV STUDIO</div>
        <h1>Create Account</h1>
        <p class="subtitle">Join the developer workspace with your credentials</p>
      </header>

      <div class="field-group">
        <label for="name">Full Name</label>
        <div class="input-wrap">
          <input id="name" type="text" autocomplete="name" placeholder="e.g. Omkar Kumbhar" />
        </div>
        <p class="field-msg" id="name-msg"></p>
      </div>

      <div class="field-group">
        <label for="email">Email Address</label>
        <div class="input-wrap">
          <input id="email" type="email" autocomplete="email" placeholder="omkar@example.com" />
        </div>
        <p class="field-msg" id="email-msg"></p>
      </div>

      <div class="field-group">
        <label for="phone">Contact Number</label>
        <div class="input-wrap">
          <input id="phone" type="tel" autocomplete="tel" placeholder="10-digit mobile number" />
        </div>
        <p class="field-msg" id="phone-msg"></p>
      </div>

      <div class="field-group">
        <div class="label-row">
          <label for="password">Password</label>
          <span class="pw-hint">Min 8 chars, mixed case & numbers</span>
        </div>
        <div class="pw-input-wrap">
          <input id="password" type="password" autocomplete="new-password" placeholder="••••••••" />
          <button type="button" id="togglePw" class="btn-toggle-pw" aria-label="Toggle password visibility">Show</button>
        </div>
        <div class="strength-track">
          <div id="strengthBar" class="strength-indicator"></div>
        </div>
        <p class="field-msg" id="password-msg"></p>
      </div>

      <button type="submit" class="btn-submit">
        <span>Complete Registration</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>

      <div id="result" class="status-banner" role="alert"></div>
    </form>
  </div>
  <script src="script.js"></script>
</body>
</html>
